name: generate snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG via Docker
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD/dist:/workspace/dist" \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            platane/snk:v3 \
            Abyyy-s \
            /workspace/dist/github-contribution-grid-snake.svg \
            /workspace/dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy to Output Branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:output
